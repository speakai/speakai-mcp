name: Deploy site to GitHub Pages

# Publishes the static site (index.html, tools.html, llms.txt, assets, CNAME)
# to mcp.speakai.co via the GitHub Actions Pages pipeline. Replaces the legacy
# "Deploy from a branch" build. .nojekyll at the repo root keeps it a plain
# static upload (no Jekyll processing).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; do NOT cancel an in-progress one (that was causing the
# competing runs to cancel each other on the legacy pipeline).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
