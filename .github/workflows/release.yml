name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Get commits since last release
        id: commits
        run: |
          # Find the last version tag (v* format), or use all history
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            COMMIT_LOG=$(git log --oneline --no-decorate -50)
          else
            COMMIT_LOG=$(git log "${LAST_TAG}..HEAD" --oneline --no-decorate)
          fi

          if [ -z "$COMMIT_LOG" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since last release."
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          CURRENT=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"

          # Use heredoc for multiline output
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "log<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMIT_LOG" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

          echo "Commits since last release:"
          echo "$COMMIT_LOG"

      - name: Decide the bump and changelog
        if: steps.commits.outputs.has_changes == 'true'
        id: bump
        env:
          COMMIT_LOG: ${{ steps.commits.outputs.log }}
        run: |
          # Conventional commits, parsed here rather than by a model. The
          # previous version called GitHub Models, which now returns 410 and
          # failed every release.
          BUMP="patch"
          if grep -qiE '^[0-9a-f]+ (BREAKING CHANGE|[a-z]+(\([^)]*\))?!:)' <<< "$COMMIT_LOG" \
            || grep -qi 'BREAKING CHANGE' <<< "$COMMIT_LOG"; then
            BUMP="major"
          elif grep -qiE '^[0-9a-f]+ feat(\([^)]*\))?:' <<< "$COMMIT_LOG"; then
            BUMP="minor"
          fi
          echo "Detected bump: $BUMP"

          # First user-facing subject, else a maintenance line. Never skip a release.
          CHANGELOG=$(grep -iE '^[0-9a-f]+ (feat|fix|perf)(\([^)]*\))?!?:' <<< "$COMMIT_LOG" \
            | head -1 | sed -E 's/^[0-9a-f]+ //')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Maintenance release"
          fi
          echo "Changelog: $CHANGELOG"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          NEW_VERSION=$(npm version "$BUMP" --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

          # One generator owns every derived surface: server.json, the three
          # plugin manifests, .mcp.json, marketplace.json, all skills, README
          # and llms.txt. tests/derived-surfaces.test.ts fails if this drifts.
          npx tsx scripts/sync-plugin.ts

          DATE=$(date +%Y-%m-%d)
          if [ -f CHANGELOG.md ]; then
            EXISTING=$(cat CHANGELOG.md)
            printf "# Changelog\n\n## %s (%s)\n\n- %s\n%s" \
              "$NEW_VERSION" "$DATE" "$CHANGELOG" \
              "$(echo "$EXISTING" | tail -n +2)" > CHANGELOG.md
          else
            printf "# Changelog\n\n## %s (%s)\n\n- %s\n" \
              "$NEW_VERSION" "$DATE" "$CHANGELOG" > CHANGELOG.md
          fi

          # Prove the release is self-consistent before it is tagged.
          npx tsx scripts/sync-plugin.ts --check

      - name: Check for tag conflict
        if: steps.bump.outputs.should_release == 'true'
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git fetch origin "refs/tags/$NEW_VERSION:refs/tags/$NEW_VERSION" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/$NEW_VERSION" >/dev/null; then
            echo "::error title=Tag conflict::Tag $NEW_VERSION already exists on the remote."
            echo "This usually means a previous release run pushed the tag but failed at a downstream step (npm / MCP / ClawHub publish)."
            echo ""
            echo "To recover:"
            echo "  1. Check what was actually published:"
            echo "     - npm view @speakai/mcp-server version"
            echo "     - npx clawhub inspect speakai --json | jq '.skill.tags'"
            echo "  2. If npm has $NEW_VERSION but ClawHub does not — finish the missing publishes manually."
            echo "  3. If nothing was actually published — delete the orphan tag:"
            echo "     git push origin --delete $NEW_VERSION"
            echo "  4. Re-run this workflow."
            exit 1
          fi
          echo "Tag $NEW_VERSION is available."

      - name: Commit and tag release
        if: steps.bump.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag "${{ steps.bump.outputs.new_version }}"
          git push origin main --tags

      - name: Publish to npm
        if: steps.bump.outputs.should_release == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        if: steps.bump.outputs.should_release == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        if: steps.bump.outputs.should_release == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.bump.outputs.should_release == 'true'
        run: ./mcp-publisher publish

      - name: Publish skill to ClawHub
        if: steps.bump.outputs.should_release == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          VERSION="${NEW_VERSION#v}"
          CHANGELOG_LINE=$(node -p "require('fs').readFileSync('CHANGELOG.md','utf8').split('\n').find(l => l.startsWith('- ')) || 'Release ${VERSION}'")
          npx -y clawhub@0.12.0 login --token "$CLAWHUB_TOKEN"
          npx -y clawhub@0.12.0 skill publish ./plugins/speakai-mcp/skills/getting-started \
            --slug speakai \
            --name "Speak AI" \
            --version "$VERSION" \
            --tags latest \
            --changelog "$CHANGELOG_LINE"
